<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var path = location.pathname;
      if (path.indexOf("/chinmayiprabhu.github.io") === 0) {
        var rest = path.replace(/^\/chinmayiprabhu\.github\.io\/?/, "");
        location.replace("/" + rest + location.search + location.hash);
        return;
      }
      var parts = path.split("/").filter(Boolean);
      if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
      var base = parts.length ? "/" + parts.join("/") + "/" : "/";
      var tag = document.createElement("base");
      tag.href = base;
      document.head.appendChild(tag);
      window.SITE_BASE = base;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <meta name="description" content="Personal academic website of Your Name." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content">
      <section id="intro"></section>

      <h2 style="margin-top:2.5rem">Recent News</h2>
      <div id="news" data-limit="5"></div>
      <p><a href="news.html">See all news →</a></p>

      <footer class="site-footer js-footer"></footer>
    </main>
  </div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
